name: Veri topla

on:
  schedule:
    - cron: '*/10 13-22 * * *'
    - cron: '25 1-12,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Toplayiciyi calistir
        run: node topla.js --once

      - name: Kaynak tanilama
        if: always()
        run: |
          cat > /tmp/tani.js << 'BETIK'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36';
          const adaylar = {
            opet:        'https://www.opet.com.tr/akaryakit-fiyatlari/istanbul-avrupa',
            doviz:       'https://www.doviz.com/akaryakit-fiyatlari/istanbul-avrupa',
            petrolofisi: 'https://www.petrolofisi.com.tr/akaryakit-fiyatlari',
            tp:          'https://www.tppd.com.tr/akaryakit-fiyatlari'
          };
          (async () => {
            for (const [ad, url] of Object.entries(adaylar)) {
              try {
                const r = await fetch(url, { headers: { 'User-Agent': UA, 'Accept-Language': 'tr-TR,tr;q=0.9' } });
                const ham = await r.text();
                const metin = ham.replace(/<script[\s\S]*?<\/script>/gi, ' ')
                                 .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                                 .replace(/<[^>]+>/g, ' ')
                                 .replace(/&nbsp;/gi, ' ')
                                 .replace(/\s+/g, ' ').trim();
                console.log('\n===== ' + ad + ' =====');
                console.log('HTTP ' + r.status + ' | ham ' + ham.length + ' | metin ' + metin.length);
                const i = metin.toLowerCase().indexOf('motorin');
                console.log('"motorin" konumu: ' + i);
                if (i >= 0) console.log('cevre: ' + JSON.stringify(metin.slice(Math.max(0, i - 150), i + 250)));
                const s = (metin.match(/\d{1,3}[.,]\d{2}/g) || []).slice(0, 25);
                console.log('ilk sayilar: ' + s.join('  '));
                if (i < 0 && ham.toLowerCase().indexOf('motorin') >= 0)
                  console.log('NOT: metinde yok ama ham HTML icinde var -> JS ile yukleniyor');
              } catch (e) {
                console.log('\n===== ' + ad + ' =====\nHATA: ' + e.message);
              }
            }
          })();
          BETIK
          node /tmp/tani.js

      - name: Sonuclari goster
        if: always()
        run: |
          echo "===== DOSYALAR ====="
          ls -la veri/ 2>/dev/null || echo "veri klasoru yok"
          echo ""
          echo "===== HATALAR ====="
          tail -30 veri/hata.jsonl 2>/dev/null || echo "hata yok"
          echo ""
          echo "===== POMPA FIYATLARI ====="
          tail -10 veri/pompa.jsonl 2>/dev/null || echo "pompa verisi yok"
          echo ""
          echo "===== HABERLER ====="
          tail -20 veri/haber.jsonl 2>/dev/null || echo "haber yok"

      - name: Veriyi kaydet
        run: |
          git config user.name  "seyahatmetre-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/
          if git diff --staged --quiet; then
            echo "Yeni veri yok, kayit atlanacak."
          else
            git commit -m "veri: $(date -u '+%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "Deneme $i basarisiz, tekrar denenecek..."
              sleep 5
            done
          fi
